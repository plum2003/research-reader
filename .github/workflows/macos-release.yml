name: macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_VERSION=0.1.0" >> "$GITHUB_ENV"
          fi

      - name: Build macOS app package
        run: bash ./script/build_and_run.sh package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResearchReader-macOS
          path: dist/ResearchReader-macos-*.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ResearchReader-macos-*.zip --title "Research Reader $GITHUB_REF_NAME" --generate-notes
